
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Husanix | Admin Dashboard</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>HUSANIX.</h1>
            <span>Admin Dashboard</span>
        </header>

        <h2>Welcome, Administrator!</h2>

        <div class="profile-card">

            <h3>Total Registered Students</h3>

            <h1>{{ total_students }}</h1>

        </div>

        <h2>All Students</h2>

        <table>

            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Roll Number</th>
                </tr>
            </thead>

            <tbody>

                {% for student in students %}

                <tr>
                    <td>{{ student.name }}</td>
                    <td>{{ student.roll_no }}</td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</body>
</html>

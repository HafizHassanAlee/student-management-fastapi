<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Husanix | Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101828, #243b55, #141e30);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 45px 35px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: slideUp 0.7s ease;
        }

        h1 {
            color: #ffffff;
            font-size: 35px;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        h1 span {
            color: #38bdf8;
        }

        h2 {
            color: #cbd5e1;
            font-size: 17px;
            font-weight: 400;
            margin-bottom: 35px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 15px;
            transition: 0.3s ease;
        }

        input::placeholder {
            color: #aab8c8;
        }

        input:focus {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.13);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
            transform: translateY(-2px);
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.35);
        }

        button:active {
            transform: scale(0.97);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 35px 25px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>HUSANIX<span>.</span></h1>
        <h2>Admin Login</h2>

        <form action="/admin/login" method="POST">

            <input
                type="text"
                name="username"
                placeholder="Admin Username"
                autocomplete="username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Admin Password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Login →</button>

        </form>

    </div>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Husanix | Admin Login</title>
</head>
<body>

    <h1>HUSANIX.</h1>
    <h2>Admin Login</h2>

    <form action="/admin/login" method="POST">

        <input
            type="text"
            name="username"
            placeholder="Admin Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Admin Password"
            required
        >

        <button type="submit">Login</button>

    </form>

</body>
</html>

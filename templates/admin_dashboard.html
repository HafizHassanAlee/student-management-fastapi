
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Husanix | Admin Dashboard</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>
<style>
 /* General Styling */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background-color: #f4f6f9;
    color: #333;
}

/* Main Container */
.container {
    width: 90%;
    max-width: 1000px;
    margin: 40px auto;
}

/* Header */
header {
    background-color: #243b55;
    color: white;
    padding: 20px 25px;
    border-radius: 8px;
    margin-bottom: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    font-size: 26px;
}

header span {
    font-size: 16px;
}

/* Headings */
h2 {
    margin: 25px 0 15px;
    color: #243b55;
}

/* Profile Card */
.profile-card {
    background-color: rgb(18, 178, 241);
    padding: 25px;
    border-radius: 8px;
    border-left: 5px solid #2563eb;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    margin-bottom: 30px;
}

.profile-card h3 {
    color: #666;
    font-size: 17px;
    margin-bottom: 12px;
}

.profile-card h1 {
    color: #2563eb;
    font-size: 35px;
}

/* Students Table */
table {
    width: 100%;
    border-collapse: collapse;
    background-color: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

th, td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    background-color: #243b55;
    color: white;
}

tr:hover {
    background-color: #f1f5f9;
}

tbody tr:last-child td {
    border-bottom: none;
}

/* Mobile Responsive */
@media (max-width: 600px) {
    .container {
        width: 95%;
        margin: 20px auto;
    }

    header {
        flex-direction: column;
        gap: 10px;
        text-align: center;
    }

    th, td {
        padding: 10px;
        font-size: 14px;
    }
}
</style>
<body>

    <div class="container">

        <header>
            <h1>HUSANIX.</h1>
            <span>Admin Dashboard</span>
        </header>

        <h2>Welcome, Administrator!</h2>

        <div class="profile-card">

            <h3>Total Registered Students</h3>

            <h1>{{ total_students }}</h1>

        </div>

        <h2>All Students</h2>

        <table>

            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Roll Number</th>
                </tr>
            </thead>

            <tbody>

                {% for student in students %}

                <tr>
                    <td>{{ student.name }}</td>
                    <td>{{ student.roll_no }}</td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</body>
</html>

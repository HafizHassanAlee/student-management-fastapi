<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ brand }}</title>
  <style>
    :root {
      --deep: #1f2a44;     /* deep indigo: background */
      --glow: #2f3f6b;     /* lighter indigo: soft glow */
      --gold: #f2b84b;     /* warm amber: brand name */
      --text: #e8ecf5;     /* soft white: body text */
    }
 
    * { margin: 0; padding: 0; box-sizing: border-box; }
 
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      background: radial-gradient(circle at 50% 35%, var(--glow), var(--deep) 70%);
    }
 
    h1 {
      font-size: clamp(3rem, 12vw, 6.5rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--gold);
    }
 
    p {
      max-width: 34ch;
      margin: 1.25rem auto 0;
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      line-height: 1.6;
    }
  </style>
</head>
<body>
    <h1>Rumiware</h1>
    <h3>Home Page</h3>
  <main>
    <h1>{{ brand }}</h1>
    <p>{{ message }}</p>
  </main>
</body>
</html>

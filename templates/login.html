<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Husanix</title>

    <style>
        /* Colors used on this page (same as the admin dashboard):
           Dark navy   : #1b2b40
           Blue        : #2563eb
           Light grey  : #f3f5f8
           Grey text   : #64748b
           Border grey : #d5dce6
        */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f3f5f8;
            color: #1b2b40;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* The white login box */
        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            border: 1px solid #e3e8ef;
            border-radius: 12px;
            padding: 40px 35px;
        }

        /* Brand name at the top */
        .brand {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #1b2b40;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d5dce6;
            border-radius: 8px;
            font-size: 14px;
        }

        /* Blue border when the user clicks inside a box */
        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Login button: navy, turns blue on hover */
        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1b2b40;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        /* "Are you an administrator?" text */
        .admin-link {
            text-align: center;
            font-size: 14px;
            color: #64748b;
            margin-top: 22px;
        }

        .admin-link a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .admin-link a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="brand">RUMIWARE.</div>

        <h1>Welcome Back!</h1>
        <p class="subtitle">Login to your Student Management System</p>

        <form action="/login" method="post">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit">Login</button>

        </form>

        <p class="admin-link">
            Are you an administrator?
            <a href="/admin/login">Admin Login</a>
        </p>

        <div class="footer">
            Student Management System by Rumiware&copy; 2026
        </div>

    </div>

</body>
</html>
